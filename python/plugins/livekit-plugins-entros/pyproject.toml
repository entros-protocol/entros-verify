[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "livekit-plugins-entros"
version = "1.0.0"
description = "First-party LiveKit Agents voice liveness and AgentPermit v2 tool-gating plugin for Entros."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Entros Protocol" },
]
dependencies = [
  "entros-verify==1.0.0",
]

[project.optional-dependencies]
livekit = [
  "livekit-agents>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/livekit_plugins_entros"]
