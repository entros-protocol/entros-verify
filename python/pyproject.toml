[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "entros-verify"
version = "1.0.0"
description = "Pure-MIT Python SDK for Entros Voice Liveness verdicts, AgentPermit v2 verification, Policy v2 evaluation, WebAuthn P-256 assertions, and IETF SCITT receipts."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Entros Protocol" },
]
keywords = [
  "entros",
  "agent-permit",
  "voice-liveness",
  "mcp",
  "webauthn",
  "scitt",
  "cose",
  "dpop",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security :: Cryptography",
  "Typing :: Typed",
]
dependencies = [
  "cryptography==50.0.2",
  "pydantic==2.14.4",
  "jcs==0.3.0",
  "PyJWT==2.15.1",
  "joserfc==1.8.0",
  "httpx>=0.28,<1.0",
  "websockets>=14.0,<16.0",
  "cbor2>=5.6,<6.0",
]

[project.optional-dependencies]
livekit = [
  "livekit-agents>=1.0",
]
pipecat = [
  "pipecat-ai>=0.0.60",
]
langgraph = [
  "langgraph>=0.4",
]
mcp = [
  "mcp==2.3.0",
]
webauthn = [
  "webauthn>=2.0",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "mypy>=1.14",
  "ruff>=0.9",
  "pip-licenses>=5.0",
]

[project.urls]
Homepage = "https://entros.io"
Repository = "https://github.com/entros-protocol/entros-verify"
Documentation = "https://entros.io/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/entros_verify"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
mypy_path = ["src", "typings", "plugins/livekit-plugins-entros/src", "plugins/pipecat-entros/src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["entros_verify", "livekit_plugins_entros", "pipecat_entros"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = [
  "tests",
  "plugins/livekit-plugins-entros/tests",
  "plugins/pipecat-entros/tests",
]
pythonpath = [
  "src",
  "plugins/livekit-plugins-entros/src",
  "plugins/pipecat-entros/src",
]
