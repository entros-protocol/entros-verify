name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify Node.js version
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v$(tr -d '[:space:]' < .nvmrc)"

      - name: Install dependencies
        run: npm ci

      - name: Verify TypeScript
        run: npm run typecheck

      - name: Run tests
        run: npm test -- --silent=true --reporter=dot

      - name: Test protected action example
        working-directory: examples/protected-action
        run: |
          npm ci
          npm test
          npm run demo

      - name: Test agent permit example
        working-directory: examples/agent-permit
        run: |
          npm ci
          npm test
          npm run demo

      - name: Build package
        run: npm run build

      - name: Verify publish contents
        run: npm run verify-publish-contents

      - name: Verify repository state
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"

  advisories:
    name: Advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # `npm audit` reads the lockfile, so this job needs no install.
      - name: Audit package dependencies
        run: npm audit --omit=dev --audit-level=high

      # The examples pull `@coral-xyz/anchor`, which carries `toml`. That advisory
      # has no fixed release, and the examples never reach Anchor's workspace
      # helper that parses TOML. Raise the threshold once a fix exists.
      - name: Audit example dependencies
        shell: bash
        run: |
          set -euo pipefail
          for example in examples/*/; do
            (cd "$example" && npm audit --omit=dev --audit-level=critical)
          done
