name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify TypeScript
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify Node.js version
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v$(tr -d '[:space:]' < .nvmrc)"

      - name: Install dependencies
        run: npm ci

      - name: Verify TypeScript
        run: npm run typecheck

      - name: Run tests
        run: npm test -- --silent=true --reporter=dot

      - name: Check runtime dependency licenses (clean-room)
        run: npm run check-licenses -- --clean-room

      - name: Test protected action example
        working-directory: examples/protected-action
        run: |
          npm ci
          npm test
          npm run demo

      - name: Test agent permit example
        working-directory: examples/agent-permit
        run: |
          npm ci
          npm test
          npm run demo

      - name: Test reference consumer example
        working-directory: examples/reference-consumer
        run: |
          npm ci
          npm test
          npm run demo

      - name: Build package
        run: npm run build

      - name: Verify publish contents
        run: npm run verify-publish-contents

      - name: Verify repository state
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"

  verify-python:
    name: Verify Python
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: python
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            python/pyproject.toml
            python/plugins/livekit-plugins-entros/pyproject.toml
            python/plugins/pipecat-entros/pyproject.toml

      - name: Install Python SDK and plugins
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]" ./plugins/livekit-plugins-entros ./plugins/pipecat-entros

      - name: Run Python tests
        run: pytest -v

      - name: Typecheck Python SDK and plugins
        run: |
          mypy --strict src
          mypy --strict plugins/livekit-plugins-entros/src plugins/pipecat-entros/src scripts

      - name: Lint Python SDK and plugins
        run: ruff check src plugins scripts tests

      - name: Check Python runtime dependency licenses and emit SBOM
        run: python scripts/check_python_licenses.py --sbom-out /tmp/entros-verify-python-sbom.cdx.json

  advisories:
    name: Advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # `npm audit` reads the lockfile, so this job needs no install.
      - name: Audit package dependencies
        run: npm audit --omit=dev --audit-level=high

      # The examples pull `@coral-xyz/anchor`, which carries `toml`. That advisory
      # has no fixed release, and the examples never reach Anchor's workspace
      # helper that parses TOML. Raise the threshold once a fix exists.
      - name: Audit example dependencies
        shell: bash
        run: |
          set -euo pipefail
          for example in examples/*/; do
            (cd "$example" && npm audit --omit=dev --audit-level=critical)
          done
